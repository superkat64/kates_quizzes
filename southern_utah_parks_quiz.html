<html>

<head>
  <style>
    :root {
      --cream-50: #fcf7ee;
      --cream-100: #f4ead8;
      --cream-200: #ebd8b4;
      --sand: #d8b17a;
      --terracotta: #a95b35;
      --rust: #8b452d;
      --desert-orange: #d98a4a;
      --sage: #6b7b4f;
      --sky: #7a95a7;
      --charcoal: #3d312d;
      --surface-1: #f7efe0;
      --surface-2: #f0dfc2;
      --border: #d8b784;
      --border-strong: #b16d3c;
      --text-primary: #3d312d;
      --text-secondary: #6c5748;
      --text-muted: #8a725d;
      --text-accent: #a95b35;
      --radius: 7px;
      --radius-lg: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8f0e3 0%, #f0dfc2 45%, #e6c89c 100%);
      color: var(--text-primary);
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        linear-gradient(180deg, rgba(125, 152, 167, 0.16) 0%, rgba(125, 152, 167, 0.02) 35%),
        linear-gradient(180deg, rgba(240, 210, 165, 0.25) 0%, rgba(184, 121, 68, 0.35) 100%);
      clip-path: polygon(0 100%, 0 60%, 10% 62%, 20% 58%, 32% 64%, 44% 56%, 58% 64%, 70% 56%, 84% 63%, 100% 54%, 100% 100%);
      transform: translateY(5%);
    }

    body::after {
      background:
        linear-gradient(180deg, rgba(169, 91, 53, 0.75) 0%, rgba(108, 58, 34, 0.95) 100%);
      clip-path: polygon(0 100%, 0 74%, 12% 70%, 24% 78%, 38% 68%, 50% 78%, 64% 68%, 78% 78%, 92% 72%, 100% 76%, 100% 100%);
      opacity: 0.85;
      transform: translateY(10%);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    #quizContent {
      background: rgba(255, 250, 242, 0.9);
      border: 1px solid rgba(177, 109, 60, 0.18);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: 0 18px 40px rgba(77, 47, 27, 0.12);
    }

    .progress-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--terracotta), var(--desert-orange));
      transition: width 0.3s ease;
    }

    .question-container {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .question-container.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .answer-btn {
      background: linear-gradient(180deg, rgba(248, 232, 202, 0.4) 0%, rgba(239, 217, 180, 0.4) 100%);
      border: 1px solid rgba(216, 183, 132, 0.75);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: 0 8px 18px rgba(120, 77, 36, 0.05);
    }

    .answer-btn:hover {
      background: linear-gradient(180deg, rgba(248, 232, 202, 0.2) 0%, rgba(239, 217, 180, 0.2) 100%);
      border-color: rgba(216, 183, 132, 0.75);
      transform: translateY(-1px);
    }

    .answer-content {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }

    .answer-photo {
      overflow: hidden;
      border-radius: 6px;
      max-height: 200px;
    }

    .answer-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 60% 50%;
    }

    .answer-text {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      line-height: 1.4;
    }

    .answer-emoji {
      font-size: 18px;
    }

    .answer-btn:active {
      transform: scale(0.98);
    }

    .results-container {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .results-container.active {
      display: block;
    }

    .result-emoji {
      font-size: 64px;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .result-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 1.25rem;
    }

    .result-card {
      background: linear-gradient(135deg, rgba(248, 233, 205, 0.95), rgba(240, 221, 189, 0.95));
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      text-align: left;
      border: 1px solid rgba(184, 127, 70, 0.16);
    }

    .result-label {
      font-size: 13px;
      color: var(--text-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .result-heading {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }

    .result-description {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .result-subtext {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .vibe-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .vibe-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drive-detail {
      background: var(--surface-2);
      border-left: 3px solid var(--text-accent);
      padding: 1rem;
      border-radius: 0;
      margin: 1rem 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .restart-btn {
      background: linear-gradient(180deg, rgba(248, 232, 202, 0.4) 0%, rgba(239, 217, 180, 0.4) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-primary);
      font-weight: 600;
      transition: all 0.2s ease;
      margin-top: 1rem;
      box-shadow: 0 8px 18px rgba(120, 77, 36, 0.08);
    }

    .restart-btn:hover {
      background: linear-gradient(180deg, rgba(248, 232, 202, 0.2) 0%, rgba(239, 217, 180, 0.2) 100%);
      border-color: var(--border);
    }

    .question-counter {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div id="quizContent"></div>
  </div>

  <script>
    const questions = [
      {
        text: "Which landscape feels most like your dream Southern Utah stop?",
        answers: [
          { text: "Iconic arches and red rock drama", regions: ["moab"], emoji: "🏜️", image: "./images/arches.png" },
          { text: "Colorful cliffs and hidden canyons", regions: ["capitolreef"], emoji: "🪨", image: "./images/capitol-reef.png" },
          { text: "Hoodoos and high-elevation wonder", regions: ["bryce"], emoji: "🌄", image: "./images/bryce.png" },
          { text: "Tall cliffs and big canyon energy", regions: ["zion"], emoji: "⛰️", image: "./images/zion.png" }

        ]
      },
      {
        text: "Your ideal hike is…",
        answers: [
          { text: "Iconic, Instagram-famous formations", regions: ["moab"], emoji: "📸" },
          { text: "Colorful cliffs and secret slot canyons", regions: ["capitolreef"], emoji: "🏜️" },
          { text: "Weird alien hoodoos in solitude", regions: ["bryce"], emoji: "🪨" },
          { text: "Epic towering cliffs and athletic challenges", regions: ["zion"], emoji: "⛰️" }
        ]
      },
      {
        text: "How important is the drive itself?",
        answers: [
          { text: "Just get me there—efficiency matters", regions: ["moab", "zion"], emoji: "⏱️" },
          { text: "The drive should be pretty, but not too long", regions: ["capitolreef", "bryce"], emoji: "🛣️" },
          { text: "I want the drive TO BE the experience", regions: ["bryce"], emoji: "🌅" }
        ]
      },
      {
        text: "Elevation and air—how do you feel?",
        answers: [
          { text: "Keep it warm and low elevation", regions: ["moab"], emoji: "🌞" },
          { text: "Some elevation is fine, moderate temps", regions: ["capitolreef"], emoji: "🌤️" },
          { text: "Higher elevation, cool air, altitude doesn't scare me", regions: ["bryce", "zion"], emoji: "❄️" }
        ]
      },
      {
        text: "Crowds—what's your tolerance?",
        answers: [
          { text: "Crowds are part of the vibe, bring it on", regions: ["moab", "zion"], emoji: "👥" },
          { text: "I prefer quieter, less touristy", regions: ["capitolreef", "bryce"], emoji: "🤐" },
          { text: "I need genuine solitude", regions: ["bryce"], emoji: "🏔️" }
        ]
      },
      {
        text: "What's your aesthetic priority?",
        answers: [
          { text: "Classic red rocks and arches", regions: ["moab"], emoji: "🏜️" },
          { text: "Diverse geology—canyons, water, color", regions: ["capitolreef"], emoji: "🌈" },
          { text: "Totally unique, alien-like landscape", regions: ["bryce"], emoji: "👽" },
          { text: "Massive scale, make me feel tiny", regions: ["zion"], emoji: "🌌" }
        ]
      },
      {
        text: "How athletic do you want to feel?",
        answers: [
          { text: "Easy walks, moderate hikes, mix it up", regions: ["moab", "capitolreef"], emoji: "🚶" },
          { text: "Good hikes but I want to finish by noon", regions: ["bryce"], emoji: "🧗" },
          { text: "Bring on the steep, athletic, challenging stuff", regions: ["zion"], emoji: "💪" }
        ]
      },
      {
        text: "Long weekend logistics—what matters most?",
        answers: [
          { text: "Closest to SLC, maximize park time", regions: ["moab"], emoji: "⚡" },
          { text: "Short drive but scenic, good balance", regions: ["capitolreef", "bryce"], emoji: "🎯" },
          { text: "Direct route, I'll get a lot done in one weekend", regions: ["zion"], emoji: "🚀" }
        ]
      }
    ];

    const regions = {
      moab: {
        name: "Moab, Arches & Canyonlands",
        emoji: "🏜️",
        subtitle: "The iconic red rock showcase",
        description: "Classic red rock formations, lower elevation, desert warmth. Famous arches, colorful canyons, and the most accessible of your options.",
        drive: "4 hours from SLC via I-70. Pretty straightforward but mostly interstate. You get to go immediately from landing to exploring.",
        weekend: "Day 1: Arches National Park (Delicate Arch, iconic walks). Day 2: Canyonlands overlooks and scenic drives. Day 3: Dead Horse Point or more Moab relaxation.",
        vibes: [
          "Iconic, Instagram-famous formations",
          "Warm desert, lower elevation",
          "Good variety of hike difficulty",
          "Closest to SLC, minimize drive time",
          "More crowded but energetic"
        ],
        logistics: "Fly SLC → direct drive Moab (~4hrs). Bus option available but drives are beautiful in this region."
      },
      capitolreef: {
        name: "Capitol Reef National Park",
        emoji: "🏜️",
        subtitle: "The colorful slot canyon hideaway",
        description: "Colorful cliffs, water features, slot canyons, and fewer crowds. Often overlooked but genuinely special geology. Less famous means more breathing room.",
        drive: "2.5 hours from SLC via scenic UT-24. Or 2 hours from Moab. Pretty drive, reasonable time investment.",
        weekend: "Day 1: Hickman Bridge, scenic drive through the park. Day 2: Capitol Gorge hike (water, canyons). Day 3: Cassidy Arch or relax. Maybe add Goblin Valley (nearby weird rock spires).",
        vibes: [
          "Colorful, unique geology",
          "Fewer crowds, more solitude",
          "Water features (slot canyons, waterfalls)",
          "Good for curious explorers",
          "Perfect middle-ground for a weekend"
        ],
        logistics: "Fly SLC → Capitol Reef (2.5hrs), or Moab → Capitol Reef (2hrs). Quieter alternative to the big parks."
      },
      bryce: {
        name: "Bryce Canyon",
        emoji: "🪨",
        subtitle: "The alien hoodoo wonderland",
        description: "Totally unique spiky hoodoo formations, high elevation, genuinely otherworldly geology. Quiet, introspective, smaller crowds. The scenic drive experience (especially from Capitol Reef) is part of the magic.",
        drive: "From SLC direct: 4+ hours. From Capitol Reef via UT-12 Scenic Byway: 2 hours of some of the most stunning scenic drive in Utah—this is the move.",
        weekend: "Sunrise at Bryce Point. Navajo Loop or Queens Garden hikes (shorter but intense). Rim walks. Maybe add Escalante detour (30min away) for slot canyons. Pure vibes, good for reflection.",
        vibes: [
          "Genuinely alien landscape",
          "Higher elevation, cooler, thinner air",
          "Fewer crowds, contemplative",
          "Best accessed via scenic UT-12 drive",
          "Shorter hikes with massive payoff",
          "Perfect if drive experience matters"
        ],
        logistics: "Recommend: Fly SLC → Moab or Capitol Reef → scenic drive to Bryce. OR SLC → direct drive (meh). The UT-12 drive IS worth the experience."
      },
      zion: {
        name: "Zion & Cedar City",
        emoji: "⛰️",
        subtitle: "The epic canyon adventure",
        description: "Towering dramatic cliffs, lush canyon floors, most famous hiking (Angels Landing, The Narrows). Most athletic and most crowded, but absolutely stunning and that feeling of being small in nature is real.",
        drive: "4-5 hours from SLC via I-15. Direct, efficient, not scenic but straightforward. No time wasted on driving.",
        weekend: "Day 1: Angels Landing (if you're game) or The Narrows. Day 2: More canyon exploring, maybe Observation Point. Day 3: Emerald Pools or Temple of Sinawava. This is the 'epic' weekend.",
        vibes: [
          "Massive towering cliffs",
          "Most challenging hikes",
          "Athletic, humbling, epic",
          "More crowded but energy is high",
          "Direct drive from SLC",
          "The most 'famous' experience"
        ],
        logistics: "Fly SLC → direct I-15 to Zion (4-5hrs). Most straightforward logistics, most famous park, most athletic. No scenic drive but efficiency for working remote."
      }
    };

    let scores = { moab: 0, capitolreef: 0, bryce: 0, zion: 0 };
    let currentQuestion = 0;

    function renderQuiz() {
      const container = document.getElementById('quizContent');
      const totalQuestions = questions.length;
      const progressPercent = (currentQuestion / totalQuestions) * 100;

      document.getElementById('progress').style.width = progressPercent + '%';

      if (currentQuestion < totalQuestions) {
        const q = questions[currentQuestion];
        let html = `
      <div class="question-container active">
        <div class="question-counter">Question ${currentQuestion + 1} of ${totalQuestions}</div>
        <div class="question-text">${q.text}</div>
        <div class="answers">
          ${q.answers.map((a, i) => `
            <button class="answer-btn" onclick="selectAnswer([${a.regions.map(r => `'${r}'`).join(', ')}])">
              <div class="answer-content">
                ${a.image ? `<div class="answer-photo"><img src="${a.image}" alt="${a.text}"></div>` : ''}
                <div class="answer-text">
                  <span class="answer-emoji">${a.emoji || '📍'}</span>
                  <span>${a.text}</span>
                </div>
              </div>
            </button>
          `).join('')}
        </div>
      </div>
    `;
        container.innerHTML = html;
      } else {
        showResults();
      }
    }

    function selectAnswer(regionArray) {
      regionArray.forEach(region => {
        scores[region]++;
      });
      currentQuestion++;
      renderQuiz();
    }

    function showResults() {
      const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
      const result = regions[winner];

      const container = document.getElementById('quizContent');
      document.getElementById('progress').style.width = '100%';

      let html = `
    <div class="results-container active">
      <div class="result-emoji">${result.emoji}</div>
      <div class="result-title">${result.name}</div>
      <div class="result-subtitle">${result.subtitle}</div>
      
      <div class="result-card">
        <div class="result-description">${result.description}</div>
      </div>

      <div class="result-card">
        <div class="result-label">The drive from SLC</div>
        <div class="result-subtext">${result.drive}</div>
      </div>
      
      <div class="result-card">
        <div class="result-label">Your long weekend</div>
        <div class="result-subtext">${result.weekend}</div>
      </div>

      <div class="result-card">
        <div class="result-label">Logistics</div>
        <div class="result-subtext">${result.logistics}</div>
      </div>
      
      <div class="result-card">
        <div class="result-label">Why this matches your vibe</div>
        <div class="vibe-list">
          ${result.vibes.map(v => `
            <div class="vibe-item">
              <span style="color: var(--text-accent);">✓</span>
              <span>${v}</span>
            </div>
          `).join('')}
        </div>
      </div>
      
      <button class="restart-btn" onclick="restartQuiz()">Take quiz again</button>
    </div>
  `;
      container.innerHTML = html;
    }

    function restartQuiz() {
      scores = { moab: 0, capitolreef: 0, bryce: 0, zion: 0 };
      currentQuestion = 0;
      renderQuiz();
    }

    renderQuiz();
  </script>
</body>

</html>
